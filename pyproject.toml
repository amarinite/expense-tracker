[project]
name = "tracker-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[project.scripts]
check = "tracker.checks:check"
tracker-dev = "tracker.checks:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
pythonpath = ["."]
